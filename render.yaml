services:
  - type: web
    name: goalsync-ai-backend
    env: python
    rootDir: goalsync-ai/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: SECRET_KEY
        value: SUPER_SECRET_KEY